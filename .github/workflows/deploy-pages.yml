name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sol-amigo-pro-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate GitHub Pages asset paths
        run: |
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "::error::The build points to /assets instead of /sol-amigo-pro/assets."
            exit 1
          fi
          grep -q '/sol-amigo-pro/assets/' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy Pages deployment
        run: sleep 45

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
