name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json ausente; usando npm install para manter a validação disponível."
            npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run check:crm
      - run: npm run build
